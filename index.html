<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff0f6">
<title>ゆめかわ♡ケーキデコ</title>
<style>
:root{--pink:#ff8fbd;--ink:#65445a;--cream:#fffaf6}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(145deg,#fff0f6,#f7f1ff 55%,#eafaff);color:var(--ink);min-height:100vh}
header{text-align:center;padding:22px 14px 12px}
h1{font-size:clamp(23px,6vw,32px);margin:0;color:#e85e9a;letter-spacing:.03em}
header p{margin:7px 0 0;font-size:13px}
.app{max-width:900px;margin:0 auto;padding:10px 14px 30px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(250px,.9fr);gap:14px}
.panel{background:#ffffffc9;border:2px solid #fff;border-radius:24px;padding:14px;box-shadow:0 8px 24px #bd8eb21c}
.cake-stage{position:relative;min-height:360px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#fff 0%,#fff7fb 58%,#fff0f7 100%);border-radius:20px;touch-action:pan-y}
.cake{position:relative;width:min(100%,390px);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;touch-action:none}
.cake-base{position:absolute;width:78%;height:61%;top:22%;left:11%;border-radius:50%;background:#ffe3eb;border:5px solid #fff;box-shadow:0 12px 0 #edb7c9,0 17px 17px #9c6e8724;transition:all .2s}
.cake-base:before{content:"";position:absolute;inset:8px;border:2px dashed #ffffffa8;border-radius:50%;pointer-events:none}
.cake-base.heart{width:72%;height:66%;top:21%;left:14%;border-radius:48% 48% 45% 45%;clip-path:polygon(50% 100%,4% 53%,0 31%,10% 13%,27% 8%,50% 28%,73% 8%,90% 13%,100% 31%,96% 53%)}
.cake-base.square{border-radius:24px;height:58%;top:24%}
.cake-base.star{clip-path:polygon(50% 0%,62% 28%,92% 30%,70% 51%,78% 82%,50% 66%,22% 82%,30% 51%,8% 30%,38% 28%);border-radius:18px}
.cake-top{position:absolute;inset:0;border-radius:inherit;background:var(--cake,#ffdce8);transition:background .2s}
.cake-base.heart .cake-top,.cake-base.star .cake-top{border-radius:inherit}
.cake-base.square .cake-top{border-radius:18px}
.drizzle{position:absolute;inset:10px;border:3px solid #fff9;border-radius:inherit;pointer-events:none}
.decor{position:absolute;z-index:3;transform:translate(-50%,-50%);font-size:clamp(24px,6vw,36px);line-height:1;user-select:none;touch-action:none;cursor:grab;filter:drop-shadow(0 2px 1px #80536b25)}
.decor:active{cursor:grabbing;scale:1.12}
.cake-label{position:absolute;bottom:4%;left:0;right:0;text-align:center;font-size:12px;color:#b87d9d;pointer-events:none}
h2{font-size:16px;margin:0 0 10px}
.group{margin-bottom:15px}
.choices{display:flex;flex-wrap:wrap;gap:7px}
.choice{border:1.5px solid #f2d3e2;background:#fff;border-radius:13px;padding:9px 11px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;min-height:40px}
.choice.active{background:#ffe0ef;border-color:#f27eaf;box-shadow:0 0 0 2px #ffd0e4}
.colors .choice{width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #e7ccda}
.colors .choice.active{box-shadow:0 0 0 3px #e85e9a}
.decor-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.decor-btn{min-height:67px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:27px;border:1.5px solid #f2d3e2;background:#fff;border-radius:14px;cursor:pointer}
.decor-btn span{font-size:10px;color:#9d718d}
.decor-btn:active{background:#ffe0ef;transform:scale(.97)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.action{flex:1;border:0;border-radius:14px;padding:12px 10px;background:#f07eaf;color:white;font-weight:700;font-size:13px;cursor:pointer}
.action.secondary{background:#fff;color:#b35c8b;border:1px solid #efc7dc}
.tip{font-size:12px;line-height:1.6;color:#a17b94;margin:10px 2px 0}
#message{min-height:18px;text-align:center;color:#dc5f9a;font-size:12px;margin-top:7px}
.icing-cookie{position:absolute;z-index:4;transform:translate(-50%,-50%);min-width:32px;min-height:38px;padding:4px 7px;display:flex;align-items:center;justify-content:center;gap:1px;background:var(--cookie,#fff8ee);border:2px solid #e8c6b5;border-radius:9px 9px 12px 12px;box-shadow:0 3px 0 #d8b6a7,0 4px 7px #8d5e6b20;color:#f08ab3;font-family:Georgia,serif;font-weight:900;font-size:clamp(18px,4.4vw,25px);letter-spacing:-.04em;line-height:1;text-shadow:0 1px #fff;cursor:grab;touch-action:none;user-select:none;white-space:nowrap}
.icing-cookie:before{content:"";position:absolute;inset:3px;border:1px dashed #ffffffb5;border-radius:6px;pointer-events:none}
.icing-cookie .cookie-char{position:relative;z-index:1}
@media(max-width:650px){.app{grid-template-columns:1fr;padding:8px 10px 24px;gap:11px}.cake-stage{min-height:300px}.cake{max-width:350px}.panel{padding:12px}.editor{order:2}.workspace{order:1}.decor-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
  <h1>🎂 ケーキデコ</h1>
  <p>好きな色、好きな飾りで、世界にひとつのケーキを作ろう！</p>
</header>
<main class="app">
  <section class="panel workspace">
    <div class="cake-stage" id="stage">
      <div class="cake" id="cake">
        <div class="cake-base" id="base"><div class="cake-top" id="top" style="background:#ffbfd5"></div><div class="drizzle"></div></div>
        <div class="cake-label">♡ SWEET DREAMS ♡</div>
      </div>
    </div>
    <div id="message">飾りを選ぶとケーキに追加できるよ ♡</div>
    <div class="actions">
      <button class="action" id="random">✨ おまかせデコ</button>
      <button class="action secondary" id="undo">↩ ひとつ戻す</button>
      <button class="action secondary" id="clear">🧁 まっさらに</button>
    </div>
    <p class="tip">💡 飾りをタップして追加、ケーキの上でドラッグして位置を調整！飾りを長押ししてゴミ箱ボタンを押すと削除できるよ。</p>
  </section>
  <section class="panel editor">
    <div class="group">
      <h2>🍰 ケーキのかたち</h2>
      <div class="choices" id="shapes">
        <button class="choice active" data-shape="round">◯ まる</button>
        <button class="choice" data-shape="heart">♡ ハート</button>
        <button class="choice" data-shape="square">▢ スクエア</button>
        <button class="choice" data-shape="star">☆ 星</button>
      </div>
    </div>
    <div class="group">
      <h2>🎨 クリームの色</h2>
      <div class="choices colors" id="colors">
        <button class="choice" data-color="#ff8a24" style="background:#ff8a24" aria-label="オレンジ" title="オレンジ"></button>
        <button class="choice" data-color="#e53945" style="background:#e53945" aria-label="赤" title="赤"></button>
        <button class="choice active" data-color="#ffbfd5" style="background:#ffbfd5" aria-label="薄ピンク" title="薄ピンク"></button>
        <button class="choice" data-color="#28a85a" style="background:#28a85a" aria-label="緑" title="緑"></button>
        <button class="choice" data-color="#fffdf7" style="background:#fffdf7" aria-label="白" title="白"></button>
        <button class="choice" data-color="#a8d83d" style="background:#a8d83d" aria-label="黄緑" title="黄緑"></button>
        <button class="choice" data-color="#ff1493" style="background:#ff1493" aria-label="ホットピンク" title="濃いピンク（ホットピンク）"></button>
        <button class="choice" data-color="#20b7c9" style="background:#20b7c9" aria-label="シーブルー" title="シーブルー"></button>
        <button class="choice" data-color="#ffdc32" style="background:#ffdc32" aria-label="黄色" title="黄色"></button>
      </div>
    </div>
    <div class="group">
      <h2>🍪 アルファベットのアイシングクッキー</h2>
      <p class="tip" style="margin:0 0 8px">好きな文字を入力して、ケーキにクッキーを飾ろう！名前や推しのイニシャルも作れるよ♡</p>
      <div style="display:flex;gap:7px;align-items:center">
        <input id="cookieText" type="text" maxlength="8" value="YUKI" aria-label="クッキーにする文字" placeholder="例：YUKI" style="min-width:0;flex:1;border:1.5px solid #f2d3e2;border-radius:12px;padding:11px;font:inherit;text-transform:uppercase;color:#65445a;background:#fff">
        <button class="choice" id="addCookie" style="background:#ffe0ef;border-color:#f27eaf;font-weight:700">🍪 作る！</button>
      </div>
      <div class="choices" id="cookieColors" style="margin-top:8px">
        <button class="choice active" data-cookie-color="#fff8ee">🤍 バニラ</button>
        <button class="choice" data-cookie-color="#ffb8d2">🩷 ピンク</button>
        <button class="choice" data-cookie-color="#b8e7ce">💚 ミント</button>
        <button class="choice" data-cookie-color="#c9a2ef">💜 むらさき</button>
        <button class="choice" data-cookie-color="#a9ddf7">🩵 ソーダ</button>
      </div>
    </div>
    <div class="group">
      <h2>🍓 トッピングを追加</h2>
      <div class="decor-grid" id="decorations">
        <button class="decor-btn" data-emoji="🍓"><b>🍓</b><span>いちご</span></button>
        <button class="decor-btn" data-emoji="🍒"><b>🍒</b><span>さくらんぼ</span></button>
        <button class="decor-btn" data-emoji="🫐"><b>🫐</b><span>ブルーベリー</span></button>
        <button class="decor-btn" data-emoji="🍑"><b>🍑</b><span>もも</span></button>
        <button class="decor-btn" data-emoji="🍦"><b>🍦</b><span>クリーム</span></button>
        <button class="decor-btn" data-emoji="🎀"><b>🎀</b><span>リボン</span></button>
        <button class="decor-btn" data-emoji="💗"><b>💗</b><span>ハート</span></button>
        <button class="decor-btn" data-emoji="⭐"><b>⭐</b><span>おほしさま</span></button>
        <button class="decor-btn" data-emoji="🌸"><b>🌸</b><span>おはな</span></button>
        <button class="decor-btn" data-emoji="🍬"><b>🍬</b><span>キャンディ</span></button>
        <button class="decor-btn" data-emoji="🍫"><b>🍫</b><span>チョコ</span></button>
        <button class="decor-btn" data-emoji="🦋"><b>🦋</b><span>ちょうちょ</span></button>
        <button class="decor-btn" data-emoji="🩷"><b>🩷</b><span>ピンクハート</span></button>
        <button class="decor-btn" data-emoji="✨"><b>✨</b><span>きらきら</span></button>
        <button class="decor-btn" data-emoji="🐻"><b>🐻</b><span>くまさん</span></button>
        <button class="decor-btn" data-emoji="🍪"><b>🍪</b><span>クッキー</span></button>
      </div>
    </div>
  </section>
</main>
<script>
const cake=document.getElementById('cake'), base=document.getElementById('base'), topLayer=document.getElementById('top'), message=document.getElementById('message');
let historyStack=[], count=0, activeDrag=null, startX=0,startY=0, moved=false;
function snapshot(){historyStack.push({shape:[...base.classList].find(x=>['heart','square','star'].includes(x))||'round',color:topLayer.style.backgroundColor,decor:[...cake.querySelectorAll('.decor,.icing-cookie')].map(d=>({kind:d.classList.contains('icing-cookie')?'cookie':'decor',emoji:d.dataset.emoji,cookie:d.dataset.cookie,color:d.style.getPropertyValue('--cookie'),x:d.style.left,y:d.style.top}))});if(historyStack.length>30)historyStack.shift();}
function updateMsg(t){message.textContent=t;}
document.getElementById('shapes').addEventListener('click',e=>{let b=e.target.closest('[data-shape]');if(!b)return;document.querySelectorAll('#shapes .choice').forEach(x=>x.classList.toggle('active',x===b));base.classList.remove('heart','square','star');if(b.dataset.shape!=='round')base.classList.add(b.dataset.shape);updateMsg('ケーキのかたちを変えたよ！');});
document.getElementById('colors').addEventListener('click',e=>{let b=e.target.closest('[data-color]');if(!b)return;document.querySelectorAll('#colors .choice').forEach(x=>x.classList.toggle('active',x===b));topLayer.style.background=b.dataset.color;updateMsg('かわいい色にチェンジ！');});
let cookieColor='#fff8ee';
document.getElementById('cookieColors').addEventListener('click',e=>{let b=e.target.closest('[data-cookie-color]');if(!b)return;cookieColor=b.dataset.cookieColor;document.querySelectorAll('#cookieColors .choice').forEach(x=>x.classList.toggle('active',x===b));});
document.getElementById('addCookie').addEventListener('click',()=>{
 let val=document.getElementById('cookieText').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
 if(!val){updateMsg('A〜Zのアルファベットを入力してな♡');return;}
 snapshot();
 let d=document.createElement('div');d.className='icing-cookie';d.dataset.cookie=val;d.dataset.emoji='';d.style.setProperty('--cookie',cookieColor);d.style.left='50%';d.style.top='47%';
 for(const ch of val){let s=document.createElement('span');s.className='cookie-char';s.textContent=ch;d.appendChild(s);}
 cake.appendChild(d);wireDrag(d);updateMsg(val+' のアイシングクッキーができたよ！ドラッグで動かせるで 🍪');
});
function addDecor(emoji,x,y){snapshot();let d=document.createElement('div');d.className='decor';d.textContent=emoji;d.dataset.emoji=emoji;d.style.left=(x??(30+Math.random()*40))+'%';d.style.top=(y??(28+Math.random()*43))+'%';d.title='ドラッグで移動';cake.appendChild(d);count++;wireDrag(d);updateMsg(emoji+' を飾ったよ！');}
document.getElementById('decorations').addEventListener('click',e=>{let b=e.target.closest('[data-emoji]');if(b)addDecor(b.dataset.emoji);});
function wireDrag(d){
 d.addEventListener('pointerdown',e=>{e.preventDefault();activeDrag=d;moved=false;startX=e.clientX;startY=e.clientY;d.setPointerCapture(e.pointerId);d.style.zIndex=10;});
 d.addEventListener('pointermove',e=>{if(activeDrag!==d)return;if(Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY)>4)moved=true;let r=cake.getBoundingClientRect();let x=Math.max(5,Math.min(95,(e.clientX-r.left)/r.width*100));let y=Math.max(5,Math.min(91,(e.clientY-r.top)/r.height*100));d.style.left=x+'%';d.style.top=y+'%';});
 d.addEventListener('pointerup',()=>{if(activeDrag===d){activeDrag=null;d.style.zIndex=3;if(moved)updateMsg('位置を調整したよ！');}});
 d.addEventListener('contextmenu',e=>{e.preventDefault();removeDecor(d);});
}
function removeDecor(d){snapshot();d.remove();updateMsg('飾りをひとつ外したよ');}
document.getElementById('undo').addEventListener('click',()=>{let s=historyStack.pop();if(!s){updateMsg('戻せる操作がないよ');return;}base.classList.remove('heart','square','star');if(s.shape!=='round')base.classList.add(s.shape);topLayer.style.background=s.color||'#ffdce8';document.querySelectorAll('#shapes .choice').forEach(b=>b.classList.toggle('active',b.dataset.shape===s.shape));document.querySelectorAll('#colors .choice').forEach(b=>b.classList.toggle('active',b.dataset.color===s.color));cake.querySelectorAll('.decor,.icing-cookie').forEach(d=>d.remove());s.decor.forEach(o=>{let d=document.createElement('div');if(o.kind==='cookie'){d.className='icing-cookie';d.dataset.cookie=o.cookie;d.style.setProperty('--cookie',o.color||'#fff8ee');for(const ch of (o.cookie||'')){let span=document.createElement('span');span.className='cookie-char';span.textContent=ch;d.appendChild(span);}}else{d.className='decor';d.textContent=o.emoji;d.dataset.emoji=o.emoji;}d.style.left=o.x;d.style.top=o.y;cake.appendChild(d);wireDrag(d);});updateMsg('ひとつ前に戻したよ ↩');});
document.getElementById('clear').addEventListener('click',()=>{if(!confirm('ケーキをまっさらにする？'))return;snapshot();cake.querySelectorAll('.decor,.icing-cookie').forEach(d=>d.remove());updateMsg('新しいケーキの準備OK！');});
document.getElementById('random').addEventListener('click',()=>{snapshot();cake.querySelectorAll('.decor,.icing-cookie').forEach(d=>d.remove());let options=['🍓','🍓','🍦','🎀','💗','⭐','🌸','✨','🍒','🫐'];for(let i=0;i<8;i++)addDecorNoHistory(options[Math.floor(Math.random()*options.length)],18+Math.random()*64,20+Math.random()*58);updateMsg('できあがり！ おまかせケーキだよ 🎂');});
function addDecorNoHistory(emoji,x,y){let d=document.createElement('div');d.className='decor';d.textContent=emoji;d.dataset.emoji=emoji;d.style.left=x+'%';d.style.top=y+'%';cake.appendChild(d);wireDrag(d);}
</script>
</body>
</html>
